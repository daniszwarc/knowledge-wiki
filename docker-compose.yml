services:

  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: knowledge_wiki
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiuser -d knowledge_wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n_default

  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wikiuser:${POSTGRES_PASSWORD}@postgres:5432/knowledge_wiki
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PIPELINE_URL: http://pipeline:8000
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      INTERNAL_URL: http://wiki:3000
    volumes:
      - /docker/apiwiki/uploads:/app/public/uploads
    labels:
      - traefik.enable=true
      - traefik.http.routers.wiki.rule=Host(`wiki.daniszwarc.cloud`)
      - traefik.http.routers.wiki.entrypoints=websecure
      - traefik.http.routers.wiki.tls=true
      - traefik.http.routers.wiki.tls.certresolver=mytlschallenge
      - traefik.http.services.wiki.loadbalancer.server.port=3000
    networks:
      - n8n_default

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wikiuser:${POSTGRES_PASSWORD}@postgres:5432/knowledge_wiki
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_API_KEY: ${LLM_API_KEY}
      WIKI_API_URL: http://wiki:3000
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
    volumes:
      - /docker/apiwiki/uploads:/app/public/uploads
    networks:
      - n8n_default

volumes:
  postgres_data:


networks:
  n8n_default:
    external: true
