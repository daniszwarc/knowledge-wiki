version: "3.9"

# Development compose — hot reload for wiki and pipeline.
# Usage: docker compose -f docker-compose.dev.yml up

services:

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_wiki
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiuser -d knowledge_wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  wiki:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wikiuser:${POSTGRES_PASSWORD}@postgres:5432/knowledge_wiki
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:latest}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wikiuser:${POSTGRES_PASSWORD}@postgres:5432/knowledge_wiki
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      WIKI_API_URL: http://wiki:3000
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./pipeline:/app
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  ollama_data:
